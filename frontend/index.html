<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POLI - Plataforma de Optimización Logística Inteligente</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="img/Logo POLI de rutas inteligentes.png" alt="POLI Logo" style="height: 48px; object-fit: contain;">
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-view="inicio">
                    <i class="ph ph-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="#" class="nav-item" data-view="operacion">
                    <i class="ph-fill ph-cube"></i>
                    <span>Operación</span>
                </a>
                <a href="#" class="nav-item" data-view="rutas">
                    <i class="ph-fill ph-map-pin-line"></i>
                    <span>Rutas</span>
                </a>
                <a href="#" class="nav-item" data-view="flota" id="nav-flota" style="display: none;">
                    <i class="ph-fill ph-truck"></i>
                    <span>Flota</span>
                </a>
                <a href="#" class="nav-item" data-view="despachador" id="nav-despachador" style="display: none;">
                    <i class="ph-fill ph-device-mobile"></i>
                    <span>Mis Entregas</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-car"></i>
                    <span>Vehículos</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-bell"></i>
                    <span>Alertas</span>
                    <span class="badge badge-danger">12</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-chart-bar"></i>
                    <span>Reportes</span>
                </a>
                <a href="#" class="nav-item">
                    <i class="ph ph-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-indicator online"></div>
                    <div class="status-text">
                        <span class="status-title">Sistema operativo</span>
                        <span class="status-subtitle">Todos los servicios activos</span>
                    </div>
                </div>
                <div class="user-profile">
                    <img src="https://ui-avatars.com/api/?name=Sebastian+Rain&background=E2E8F0&color=475569" alt="User Avatar" class="avatar">
                    <div class="user-info">
                        <span class="user-name">Sebastian Rain</span>
                        <span class="user-company">TransAndes</span>
                    </div>
                    <i class="ph ph-caret-down"></i>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <!-- Header -->
            <header class="top-header">
                <div class="header-left" id="header-title-container">
                    <h2 class="page-title">Panel de control</h2>
                    <p class="page-subtitle">Resumen de la operación logística</p>
                </div>
                
                <div class="header-right">
                    <div class="search-bar" id="global-search" style="display: none;">
                        <i class="ph ph-magnifying-glass"></i>
                        <input type="text" placeholder="Buscar por ID, ruta o vehículo">
                    </div>
                    
                    <div class="header-widget">
                        <i class="ph ph-calendar-blank"></i>
                        <span>Lunes, 6 de julio de 2026</span>
                    </div>
                    <div class="header-widget">
                        <i class="ph ph-sun"></i>
                        <span>10:24</span>
                    </div>
                    
                    <button class="btn btn-primary" id="header-action-btn" style="display: none;">
                        <i class="ph ph-plus"></i>
                        <span id="header-action-text">Nueva operación</span>
                    </button>
                </div>
            </header>

            <!-- Dynamic View Container -->
            <div id="view-container" class="view-container">
                <!-- Views will be injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/api.js"></script>
    <script src="js/views/inicio.js"></script>
    <script src="js/views/operacion.js"></script>
    <script src="js/views/rutas.js"></script>
    <script src="js/views/flota.js"></script>
    <script src="js/views/despachador.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
